general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 2
    blur_size = 4
    brightness = 0.75
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(ffffffff)

    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 55
    outline_thickness = 2
    rounding = 12

    outer_color = rgba(ff3200d9)
    inner_color = rgba(111111dd)
    font_color = rgba(ffffffff)

    position = 0, -60
    halign = center
    valign = center
}