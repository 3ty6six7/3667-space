# ------------------------------------------------------------
# RANDOM CONFIG THAT I DONT EVEN KNOW
# BY VINH SAMA _ 3TY6SIX7
# ------------------------------------------------------------

general {
    hide_cursor = true
    disable_loading_bar = true
}

# ------------------------------------------------------------
# LIVE BACKGROUND
# No wallpaper path — blur whatever is currently underneath.
# ------------------------------------------------------------

background {
    monitor =

    path = screenshot 

    blur_passes = 3
    blur_size = 6

    noise = 0.015
    contrast = 0.92
    brightness = 0.70
}

# ------------------------------------------------------------
# CLOCK
# ------------------------------------------------------------

label {
    monitor =

    text = cmd[update:1000] echo "$(date +'%H:%M')"

    font_size = 68
    font_family = JetBrainsMono Nerd Font
    color = rgba(ffffffff)

    position = 0, 75
    halign = center
    valign = center
}

# ------------------------------------------------------------
# DATE
# ------------------------------------------------------------

label {
    monitor =

    text = cmd[update:60000] echo "$(date +'%d %B %Y' | tr '[:lower:]' '[:upper:]')"

    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = rgba(ffffff99)

    position = 0, 18
    halign = center
    valign = center
}

# ------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------

input-field {
    monitor =

    size = 280, 48

    outline_thickness = 1
    rounding = 24

    outer_color = rgba(ff3200b0)
    inner_color = rgba(00000055)

    font_color = rgba(ffffffff)

    placeholder_text = Password
    hide_input = false

    position = 0, -58
    halign = center
    valign = center
}

